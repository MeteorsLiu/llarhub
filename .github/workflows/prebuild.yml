name: Prebuild artifacts

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: prebuild-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Find changed modules
    runs-on: ubuntu-24.04
    outputs:
      modules: ${{ steps.modules.outputs.modules }}
      has_modules: ${{ steps.modules.outputs.has_modules }}

    steps:
      - name: Check out formulas
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Qiniu Go environment
        shell: bash
        run: |
          echo "GOPATH=${RUNNER_TEMP}/go" >> "$GITHUB_ENV"
          echo "GOBIN=${RUNNER_TEMP}/go/bin" >> "$GITHUB_ENV"
          echo "GOMODCACHE=${RUNNER_TEMP}/go/pkg/mod" >> "$GITHUB_ENV"
          echo "GOCACHE=${RUNNER_TEMP}/go-build-cache" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25.0
          cache: false

      - name: Find changed modules
        id: modules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          go install -tags=linknamefix -ldflags="-checklinkname=0" github.com/goplus/ixgo/cmd/ixgo@latest
          "$(go env GOPATH)/bin/ixgo" run .github/scripts/find_changed_modules.gsh

  prebuild:
    name: Prebuild ${{ matrix.target }} on linux-amd64
    needs: changes
    if: needs.changes.outputs.has_modules == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: amd64-darwin
            goos: darwin
            goarch: amd64
          - target: arm64-darwin
            goos: darwin
            goarch: arm64
          - target: arm64-linux
            goos: linux
            goarch: arm64

    steps:
      - name: Check out formulas
        uses: actions/checkout@v7

      - name: Check out llar
        uses: actions/checkout@v7
        with:
          repository: goplus/llar
          ref: main
          path: .llar-source

      - name: Configure Qiniu Go environment
        shell: bash
        run: |
          echo "GOPATH=${RUNNER_TEMP}/go" >> "$GITHUB_ENV"
          echo "GOBIN=${RUNNER_TEMP}/go/bin" >> "$GITHUB_ENV"
          echo "GOMODCACHE=${RUNNER_TEMP}/go/pkg/mod" >> "$GITHUB_ENV"
          echo "GOCACHE=${RUNNER_TEMP}/go-build-cache" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .llar-source/go.mod
          cache: false

      - name: Install llar
        working-directory: .llar-source
        run: |
          go install -ldflags="-checklinkname=0" ./cmd/llar
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Prebuild changed modules
        shell: bash
        run: |
          while IFS= read -r module; do
            [ -n "$module" ] || continue
            output_dir="$RUNNER_TEMP/prebuilt/$module"
            mkdir -p "$output_dir"
            llar make --verbose "./$module" \
              --os "${{ matrix.goos }}" \
              --arch "${{ matrix.goarch }}" \
              --output "$output_dir/${{ matrix.target }}.tar.gz" \
              --json \
              > "$output_dir/${{ matrix.target }}.json"
          done < <(jq -r '.[]' <<< '${{ needs.changes.outputs.modules }}')

      - name: Upload prebuilt artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-${{ matrix.target }}
          path: ${{ runner.temp }}/prebuilt
          if-no-files-found: error

  verify:
    name: ${{ matrix.module }} (${{ matrix.platform }})
    needs: [changes, prebuild]
    if: needs.changes.outputs.has_modules == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
        platform:
          - arm64-linux
          - amd64-darwin
          - arm64-darwin
        include:
          - platform: arm64-linux
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - platform: amd64-darwin
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - platform: arm64-darwin
            runner: macos-latest
            goos: darwin
            goarch: arm64

    steps:
      - name: Check out formulas
        uses: actions/checkout@v7

      - name: Check out llar
        uses: actions/checkout@v7
        with:
          repository: goplus/llar
          ref: main
          path: .llar-source

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential ca-certificates cmake curl gperf groff patch

      - name: Install LLVM 19 on Linux
        if: runner.os == 'Linux'
        run: |
          curl --fail --silent --show-error --location \
            https://apt.llvm.org/llvm-snapshot.gpg.key \
            --output "$RUNNER_TEMP/apt.llvm.org.asc"
          sudo install -m 644 "$RUNNER_TEMP/apt.llvm.org.asc" /usr/share/keyrings/apt.llvm.org.asc
          echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" \
            | sudo tee /etc/apt/sources.list.d/llvm19.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19 lld-19 llvm-19
          echo "/usr/lib/llvm-19/bin" >> "$GITHUB_PATH"

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake gperf groff llvm@19 lld@19
          echo "$(brew --prefix llvm@19)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld@19)/bin" >> "$GITHUB_PATH"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .llar-source/go.mod
          cache: false

      - name: Verify runner platform
        shell: bash
        run: |
          test "$(go env GOOS)" = "${{ matrix.goos }}"
          test "$(go env GOARCH)" = "${{ matrix.goarch }}"

      - name: Install llar
        working-directory: .llar-source
        run: |
          go install -ldflags="-checklinkname=0" ./cmd/llar
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Test module
        shell: bash
        run: |
          llar test --verbose "./${{ matrix.module }}" \
            --os "${{ matrix.goos }}" \
            --arch "${{ matrix.goarch }}"

      - name: Download prebuilt artifact
        uses: actions/download-artifact@v4
        with:
          name: prebuilt-${{ matrix.platform }}
          path: ${{ runner.temp }}/prebuilt

      - name: Install prebuilt artifact in workspace
        shell: bash
        run: |
          module='${{ matrix.module }}'
          target='${{ matrix.platform }}'
          prebuilt_dir="$RUNNER_TEMP/prebuilt/$module"
          prebuilt_manifest="$prebuilt_dir/$target.json"
          archive="$prebuilt_dir/$target.tar.gz"
          native_manifest="$RUNNER_TEMP/native-$target.json"

          llar make --json "./$module" \
            --os "${{ matrix.goos }}" \
            --arch "${{ matrix.goarch }}" \
            > "$native_manifest"

          version=$(jq -er .version "$prebuilt_manifest")
          native_version=$(jq -er .version "$native_manifest")
          if [ "$native_version" != "$version" ]; then
            echo "native version $native_version does not match prebuilt version $version" >&2
            exit 1
          fi

          native_dir=$(jq -er .dir "$native_manifest")
          suffix="@$version-$target"
          if [[ "$native_dir" != *"$suffix" ]]; then
            echo "native output $native_dir does not end with $suffix" >&2
            exit 1
          fi
          cache_dir=${native_dir%"$suffix"}
          cache_file="$cache_dir/.cache.json"
          cache_key="$version-$target"

          metadata_json=$(tar -xOzf "$archive" .llar/metadata.json)
          metadata=$(jq -er .metadata <<< "$metadata_json")
          metadata=${metadata//'{{.InstallDir}}'/$native_dir}

          rm -rf "$native_dir"
          mkdir -p "$native_dir"
          tar -xzf "$archive" -C "$native_dir"
          rm "$native_dir/.llar/metadata.json"

          jq -e --arg key "$cache_key" '.cache[$key] != null' "$cache_file" >/dev/null
          updated_cache="$RUNNER_TEMP/cache-$target.json"
          jq --arg key "$cache_key" --arg metadata "$metadata" \
            '.cache[$key].metadata = $metadata' \
            "$cache_file" > "$updated_cache"
          mv "$updated_cache" "$cache_file"

      - name: Run onTest against prebuilt artifact
        shell: bash
        run: |
          llar test --verbose "./${{ matrix.module }}" \
            --os "${{ matrix.goos }}" \
            --arch "${{ matrix.goarch }}"
